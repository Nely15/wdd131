<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by rating features, selecting an installation date, and providing optional feedback.">
    <meta name="author" content="Blanca Ruiz">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="product-review-form/styles/form.css">
    
    <script src="product-review-form/scripts/form.js" defer></script>

</head>


<body>

    <header>

        <h1>Product Review Form</h1>

    </header>

    <main>

        <form method="get" action="review.html">

            <label for="product">Product Name *</label>

            <select id="product" name="product" required>

                <option value="" disabled selected>Select a Product ...</option>

            </select>

            <!--Rating-->

            <fieldset>

                <legend>Overall Rating *</legend>

                <div class="rating-group">
                    
                    <div class="rating-option">

                        <label for="rating1">★</label>
                        <input type="radio" name="rating" id="rating1" value="1" required>
                      
                    </div>

                    <div class="rating-option">
                    
                        <label for="rating2">★★</label>
                        <input type="radio" name="rating" id="rating2" value="2" required>
                    
                    </div>

                    <div class="rating-option">
                    
                        <label for="rating3">★★★</label>
                        <input type="radio" name="rating" id="rating3" value="3" required>
                    
                    </div>

                    <div class="rating-option">
                    
                        <label for="rating4">★★★★</label>
                        <input type="radio" name="rating" id="rating4" value="4" required>
                    
                    </div>

                    <div class="rating-option">
                    
                        <label for="rating5">★★★★★</label>
                        <input type="radio" name="rating" id="rating5" value="5" required>
                    
                    </div>
        
                </div>

            </fieldset>

            <!--Date-->

            <label for="installDate">Date of Installation *</label>

            <input type="date" id="installDate" name="installDate" required>

            <!--Features-->

            <fieldset>

                <legend>Which features did you find useful in the product? 
                    <br>
                    (Check all that apply)
                </legend>

                <div class="feature-group">
     
                    <input type="checkbox" id="durability" name="features" value="Durability">

                    <label for="durability">Durability</label>
                
                </div>

                
                <div class="feature-group">

                    <input type="checkbox" id="ease" name="features" value="Ease of Use">

                    <label for="ease">Ease of Use</label>

                </div>


                <div class="feature-group">

                    <input type="checkbox" id="performance" name="features" value="Performance">

                    <label for="performance">Performance</label>
                
                </div>


                <div class="feature-group">

                    <input type="checkbox" id="design" name="features" value="Design">
                    
                    <label for="design">Design</label>

                </div>
                
            </fieldset>

            <!--Written Review-->

            <label for="review">Written Review <span>(Optional)</span></label>

            <textarea id="review" name="review" rows="6">
            </textarea>

            <!--Name-->

            <label for="username"> Your Name <span>(Optional)</span></label>

            <input type="text" id="username" name="username">

            <!--Submit-->
            <input type="submit" value="Post Review">

        </form>

    </main>

    <footer>

        <p>© <span id="currentYear"></span> | Blanca Ruiz | Texas </p>

        <p id="lastModified"></p>

    </footer>


</body>

</html>
